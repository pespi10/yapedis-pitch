<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>YaPedís × MongoDB — Pitch Interactivo</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          mongo: {
            green: '#00ED64',
            dark: '#001E2B',
            slate: '#023430',
            forest: '#00684A',
            mint: '#C3F4D7'
          }
        },
        fontFamily: {
          sans: ['Inter', 'system-ui', 'sans-serif'],
          mono: ['JetBrains Mono', 'Menlo', 'monospace']
        }
      }
    }
  }
</script>
<style>
  html, body, #root { height: 100%; margin: 0; }
  body { font-family: 'Inter', system-ui, sans-serif; background: #001E2B; color: white; overflow: hidden; }
  * { box-sizing: border-box; }
  .scrollbar-hide::-webkit-scrollbar { display: none; }
  .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
  .code-block { background: #00141C; border: 1px solid #023430; border-radius: 8px; padding: 16px; font-family: 'JetBrains Mono', monospace; font-size: 13px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
  .gradient-text { background: linear-gradient(135deg, #00ED64 0%, #C3F4D7 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .glow-green { box-shadow: 0 0 40px rgba(0, 237, 100, 0.15); }
  @keyframes pulse-dot { 0%,100% { opacity: 0.3; transform: scale(1); } 50% { opacity: 1; transform: scale(1.2); } }
  .pulse-dot { animation: pulse-dot 1.5s ease-in-out infinite; }
  @keyframes shard-pulse { 0% { transform: scale(1); } 50% { transform: scale(1.06); } 100% { transform: scale(1); } }
  .shard-active { animation: shard-pulse 0.4s ease-out; }
  @keyframes fade-up { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  .fade-up { animation: fade-up 0.5s ease-out backwards; }
  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
  .fade-in { animation: fade-in 0.4s ease-out; }
  @keyframes drop { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(120px); } }
  .query-drop { animation: drop 1.2s ease-in forwards; }
  input[type=range].mongo-range { accent-color: #00ED64; }
  textarea, button { font-family: inherit; }
</style>
</head>
<body class="bg-mongo-dark">
<div id="root"></div>
<script type="module">
import React, { useState, useEffect, useMemo, useCallback } from 'https://esm.sh/react@18.3.1';
import { createRoot } from 'https://esm.sh/react-dom@18.3.1/client';
import htm from 'https://esm.sh/htm@3.1.1';
const html = htm.bind(React.createElement);
const e = React.createElement;

// =================== PORTADA ===================
function Portada({ goTo }) {
  const url = typeof window !== 'undefined' ? window.location.href : 'https://yapedis.vercel.app';
  const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encodeURIComponent(url)}`;
  return html`
    <div class="min-h-full flex items-center justify-center p-12 relative">
      <div class="absolute top-20 left-20 w-96 h-96 rounded-full bg-mongo-green/10 blur-[120px]"></div>
      <div class="absolute bottom-20 right-20 w-96 h-96 rounded-full bg-mongo-forest/20 blur-[120px]"></div>
      <div class="relative z-10 grid grid-cols-1 lg:grid-cols-2 gap-12 items-center max-w-7xl w-full">
        <div>
          <div class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-mongo-green/10 border border-mongo-green/30 text-mongo-green text-xs font-medium mb-6 fade-up" style=${{animationDelay:'0.1s'}}>
            <span class="w-2 h-2 bg-mongo-green rounded-full pulse-dot"></span>
            Gestión y Arquitectura de Datos · Presentación interactiva
          </div>
          <h1 class="text-6xl lg:text-7xl font-extrabold tracking-tight leading-[1.05] mb-6 fade-up" style=${{animationDelay:'0.2s'}}>
            Tus datos no son <span class="gradient-text">tablas.</span>
            <br/>
            <span class="text-white/60">¿Por qué seguís forzándolos a serlo?</span>
          </h1>
          <p class="text-xl text-white/70 mb-8 max-w-xl fade-up" style=${{animationDelay:'0.4s'}}>
            Vamos a construir <strong class="text-mongo-green">YaPedís</strong> (un clon de PedidosYa). Te vamos a mostrar por qué SQL te frena y por qué MongoDB te libera.
          </p>
          <div class="flex gap-4 items-center fade-up" style=${{animationDelay:'0.6s'}}>
            <button onClick=${() => goTo(1)} class="px-6 py-3 bg-mongo-green text-mongo-dark font-bold rounded-lg hover:bg-mongo-mint transition-all hover:scale-105 glow-green">
              Empezar pitch →
            </button>
            <span class="text-white/40 text-sm">5 bloques · 15-20 min · Pitch interactivo</span>
          </div>
        </div>
        <div class="flex flex-col items-center gap-4 fade-up" style=${{animationDelay:'0.7s'}}>
          <div class="bg-white p-6 rounded-2xl glow-green">
            <img src=${qrUrl} width="220" height="220" alt="QR" />
          </div>
          <div class="text-center">
            <p class="text-mongo-green font-bold text-lg mb-1">Escaneá y seguinos en vivo</p>
            <p class="text-white/50 text-sm break-all max-w-xs">${url.replace('https://','').replace('http://','')}</p>
          </div>
        </div>
      </div>
    </div>
  `;
}

// =================== BLOQUE 1 ===================
const camposBase = ['nombre', 'precio', 'descripción'];
const camposExtra = [
  { id: 'tamaño', label: 'tamaño (chico/grande)' },
  { id: 'sin_tacc', label: 'sin TACC' },
  { id: 'picante', label: 'nivel de picante' },
  { id: 'adicionales', label: 'lista de adicionales' },
  { id: 'imagen', label: 'imagen del plato' },
];

function Bloque1() {
  const [extra, setExtra] = useState(0);
  const total = camposBase.length + extra;
  const tablas = 4 + extra * 2;
  const joins = 3 + extra * 2;

  const sqlCode = `-- Hay que crear tabla nueva por cada atributo
CREATE TABLE menu_item (id, restaurante_id, nombre, precio);
CREATE TABLE menu_descripcion (item_id, descripcion);${extra>=1?'\nCREATE TABLE menu_tamanos (item_id, tamano);\nCREATE TABLE menu_precios_tamano (item_id, tamano_id, precio);':''}${extra>=2?'\nCREATE TABLE menu_tacc (item_id, sin_tacc);\nCREATE TABLE menu_tacc_audit (...);':''}${extra>=3?'\nCREATE TABLE menu_picante (item_id, nivel);\nCREATE TABLE menu_picante_alergias (...);':''}${extra>=4?'\nCREATE TABLE menu_adicionales (...);\nCREATE TABLE adicional_item (...);':''}${extra>=5?'\nCREATE TABLE menu_imagen (item_id, url);\nCREATE TABLE imagen_metadata (...);':''}

-- Para leer UN item necesitás:
SELECT * FROM menu_item m
  JOIN menu_descripcion d ON d.item_id = m.id${extra>=1?'\n  JOIN menu_tamanos t ON t.item_id = m.id\n  JOIN menu_precios_tamano pt ON ...':''}${extra>=2?'\n  JOIN menu_tacc tc ON ...':''}${extra>=3?'\n  JOIN menu_picante p ON ...':''}
  WHERE m.id = 1;`;

  const mongoCode = `{
  "_id": "milanesa_napo",
  "nombre": "Milanesa Napolitana",
  "precio": 4500,
  "descripcion": "Con jamón, queso y salsa"${extra>=1?',\n  "tamaños": [\n    { "nombre": "chica", "precio": 3500 },\n    { "nombre": "grande", "precio": 4500 }\n  ]':''}${extra>=2?',\n  "sinTacc": false':''}${extra>=3?',\n  "picante": "medio"':''}${extra>=4?',\n  "adicionales": [\n    { "nombre": "huevo", "precio": 500 },\n    { "nombre": "papas", "precio": 800 }\n  ]':''}${extra>=5?',\n  "imagen": "https://..."':''}
}

// Para leer el item:
db.menu.findOne({ _id: "milanesa_napo" })
// Listo. Todo en un solo documento.`;

  return html`
    <div class="min-h-full p-10 lg:p-16">
      <div class="max-w-7xl mx-auto">
        <div class="mb-2 text-mongo-green text-sm font-semibold tracking-wider uppercase">Bloque 1 · El Problema</div>
        <h2 class="text-5xl font-extrabold mb-4">Construyamos <span class="gradient-text">YaPedís</span> en SQL.</h2>
        <p class="text-xl text-white/70 mb-10 max-w-3xl">
          Spoiler: cada vez que agregás algo al menú, tu modelo relacional <strong class="text-red-400">se complica más</strong>.
        </p>

        <div class="mb-10 p-6 bg-white/5 border border-white/10 rounded-xl">
          <div class="flex items-center justify-between mb-4">
            <div>
              <div class="text-xs uppercase tracking-wider text-white/40 mb-1">Probá vos mismo</div>
              <div class="font-bold text-lg">Agregá campos al menú de YaPedís</div>
            </div>
            <div class="text-3xl font-extrabold text-mongo-green tabular-nums">
              ${total} <span class="text-sm text-white/40 font-normal">campos</span>
            </div>
          </div>
          <input type="range" min="0" max=${camposExtra.length} value=${extra} onChange=${(ev)=>setExtra(parseInt(ev.target.value))} class="w-full mongo-range cursor-pointer" />
          <div class="flex flex-wrap gap-2 mt-4">
            ${camposBase.map(c => html`<span key=${c} class="px-2 py-1 rounded bg-white/10 text-xs">${c}</span>`)}
            ${camposExtra.slice(0, extra).map(c => html`
              <span key=${c.id} class="px-2 py-1 rounded bg-mongo-green/20 border border-mongo-green/40 text-mongo-green text-xs fade-in">+ ${c.label}</span>
            `)}
          </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
          <div class="bg-white/5 border-2 rounded-xl p-6 flex flex-col transition-colors" style=${{borderColor: extra > 2 ? 'rgba(239,68,68,0.5)' : 'rgba(255,255,255,0.1)'}}>
            <div class="flex items-center justify-between mb-4">
              <h3 class="text-xl font-bold flex items-center gap-2">
                <span class="text-red-400">⚠</span> SQL Relacional
              </h3>
              <div class="text-right">
                <div class="text-2xl font-extrabold text-red-400 tabular-nums">${tablas} tablas</div>
                <div class="text-xs text-white/40">${joins} JOINs por query</div>
              </div>
            </div>
            <div class="code-block flex-1 text-xs">${sqlCode}</div>
            ${extra >= 3 && html`<div class="mt-3 text-red-400 text-sm font-semibold fade-in">😰 Migración + queries lentas + dolor de cabeza</div>`}
          </div>

          <div class="bg-mongo-green/5 border-2 border-mongo-green/30 rounded-xl p-6 flex flex-col">
            <div class="flex items-center justify-between mb-4">
              <h3 class="text-xl font-bold flex items-center gap-2">
                <span class="text-mongo-green">✓</span> MongoDB (Documento)
              </h3>
              <div class="text-right">
                <div class="text-2xl font-extrabold text-mongo-green tabular-nums">1 colección</div>
                <div class="text-xs text-white/40">0 JOINs</div>
              </div>
            </div>
            <div class="code-block flex-1 text-xs">${mongoCode}</div>
            <div class="mt-3 text-mongo-green text-sm font-semibold">🚀 Cero migraciones. Una sola query. Schema flexible.</div>
          </div>
        </div>

        <div class="mt-8 text-center text-white/60 text-sm italic">
          💡 ¿Y si te dijéramos que esto no es teoría — <strong class="text-white">Rappi maneja millones de pedidos así</strong>?
        </div>
      </div>
    </div>
  `;
}

// =================== BLOQUE 2 ===================
const restauranteInicial = {
  nombre: "La Esquina de Don José",
  cocina: ["argentina", "parrilla"],
  rating: 4.7,
  abierto: true,
  direccion: {
    calle: "Av. Corrientes 1234",
    ciudad: "CABA",
    coords: [-58.388, -34.605]
  },
  menu: [
    { nombre: "Bife de Chorizo", precio: 6500, popular: true },
    { nombre: "Empanadas", precio: 800, cantidad: 12 }
  ],
  delivery: ["YaPedís", "Rappi"]
};

function Bloque2() {
  const [json, setJson] = useState(JSON.stringify(restauranteInicial, null, 2));
  const parsed = useMemo(() => {
    try { return { ok: true, doc: JSON.parse(json) }; }
    catch (err) { return { ok: false, err: err.message }; }
  }, [json]);

  const conceptos = [
    { titulo: 'Documento', desc: 'JSON enriquecido (BSON). Acepta arrays, objetos anidados, geo, fechas.', icon: '📄' },
    { titulo: 'Colección', desc: 'Grupo de documentos. Como una "tabla", pero cada documento puede ser distinto.', icon: '📚' },
    { titulo: 'Database', desc: 'Conjunto de colecciones. Un Atlas cluster puede tener muchas DBs.', icon: '🗄️' },
  ];

  return html`
    <div class="min-h-full p-10 lg:p-16">
      <div class="max-w-7xl mx-auto">
        <div class="mb-2 text-mongo-green text-sm font-semibold tracking-wider uppercase">Bloque 2 · ¿Qué es MongoDB?</div>
        <h2 class="text-5xl font-extrabold mb-4">Pensá en <span class="gradient-text">documentos</span>, no en tablas.</h2>
        <p class="text-xl text-white/70 mb-10 max-w-3xl">
          Un documento MongoDB es un objeto JSON. Una colección es un conjunto de documentos. Sin esquema rígido, sin JOINs forzados.
        </p>

        <div class="grid grid-cols-3 gap-4 mb-10">
          ${conceptos.map((c,i) => html`
            <div key=${c.titulo} class="p-5 bg-white/5 border border-white/10 rounded-xl hover:border-mongo-green/40 transition-all fade-up" style=${{animationDelay: `${i*0.1}s`}}>
              <div class="text-3xl mb-2">${c.icon}</div>
              <div class="font-bold text-lg mb-1 text-mongo-green">${c.titulo}</div>
              <div class="text-sm text-white/60">${c.desc}</div>
            </div>
          `)}
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
          <div>
            <div class="flex items-center justify-between mb-3">
              <h3 class="font-bold text-lg">📝 Editá el documento en vivo</h3>
              <div class=${`px-2 py-1 rounded text-xs font-bold ${parsed.ok ? 'bg-mongo-green/20 text-mongo-green' : 'bg-red-500/20 text-red-400'}`}>
                ${parsed.ok ? '✓ JSON válido' : '✗ JSON inválido'}
              </div>
            </div>
            <textarea
              value=${json}
              onChange=${(ev)=>setJson(ev.target.value)}
              class="w-full h-[400px] code-block resize-none focus:outline-none focus:border-mongo-green/60"
              spellCheck=${false}
            ></textarea>
            ${!parsed.ok && html`<div class="mt-2 text-red-400 text-xs font-mono">${parsed.err}</div>`}
          </div>

          <div>
            <h3 class="font-bold text-lg mb-3">👀 Así lo guarda MongoDB</h3>
            <div class="bg-mongo-green/5 border border-mongo-green/30 rounded-xl p-5 h-[400px] overflow-y-auto">
              ${parsed.ok && parsed.doc ? renderDoc(parsed.doc) : html`<div class="text-white/40 italic">Arreglá el JSON para ver la vista previa...</div>`}
            </div>
          </div>
        </div>

        <div class="mt-6 p-4 bg-mongo-green/10 border border-mongo-green/30 rounded-xl text-sm">
          <strong class="text-mongo-green">💡 Lo más importante:</strong> agregá un campo nuevo al JSON (probá <code class="bg-mongo-dark px-1.5 py-0.5 rounded">"telefono": "11-1234"</code>) y miralo aparecer. <strong>No hubo ALTER TABLE. No hubo migración.</strong> Eso es schema flexible.
        </div>
      </div>
    </div>
  `;
}

function renderDoc(doc) {
  return html`
    <div class="space-y-3 text-sm">
      ${doc.nombre !== undefined && html`<${Field} label="Nombre" value=${doc.nombre} mono=${true} />`}
      ${Array.isArray(doc.cocina) && html`
        <div>
          <div class="text-xs text-white/40 uppercase tracking-wider mb-1">Cocinas (array)</div>
          <div class="flex flex-wrap gap-1">
            ${doc.cocina.map(c => html`<span key=${c} class="px-2 py-0.5 bg-white/10 rounded text-xs">${String(c)}</span>`)}
          </div>
        </div>
      `}
      ${doc.rating !== undefined && html`<${Field} label="Rating" value=${`⭐ ${doc.rating}`} />`}
      ${doc.abierto !== undefined && html`<${Field} label="Estado" value=${doc.abierto ? '🟢 Abierto' : '🔴 Cerrado'} />`}
      ${doc.direccion && typeof doc.direccion === 'object' && html`
        <div>
          <div class="text-xs text-white/40 uppercase tracking-wider mb-1">Dirección (objeto anidado)</div>
          <div class="ml-4 pl-3 border-l-2 border-mongo-green/30 space-y-1">
            ${Object.entries(doc.direccion).map(([k,v]) => html`
              <${Field} key=${k} label=${k} value=${Array.isArray(v) ? v.join(', ') : String(v)} small=${true} />
            `)}
          </div>
        </div>
      `}
      ${Array.isArray(doc.menu) && html`
        <div>
          <div class="text-xs text-white/40 uppercase tracking-wider mb-1">Menú (${doc.menu.length} items anidados)</div>
          <div class="ml-4 pl-3 border-l-2 border-mongo-green/30 space-y-2">
            ${doc.menu.map((item,i) => html`
              <div key=${i} class="p-2 bg-white/5 rounded">
                <div class="font-mono text-xs">${item.nombre ?? JSON.stringify(item)}</div>
                ${item.precio !== undefined && html`<div class="text-xs text-mongo-green">$${item.precio}</div>`}
              </div>
            `)}
          </div>
        </div>
      `}
      ${Object.entries(doc).filter(([k]) => !['nombre','cocina','rating','abierto','direccion','menu'].includes(k)).map(([k,v]) => html`
        <${Field} key=${k} label=${k} value=${typeof v === 'object' ? JSON.stringify(v) : String(v)} />
      `)}
    </div>
  `;
}

function Field({ label, value, mono, small }) {
  return html`
    <div>
      <div class=${`text-white/40 uppercase tracking-wider ${small ? 'text-[10px]' : 'text-xs'}`}>${label}</div>
      <div class=${`${mono ? 'font-mono' : ''} ${small ? 'text-xs' : 'text-sm'}`}>${String(value)}</div>
    </div>
  `;
}

// =================== BLOQUE 3 ===================
const shards = [
  { id: 1, region: 'CABA', color: '#00ED64' },
  { id: 2, region: 'Córdoba', color: '#22D3EE' },
  { id: 3, region: 'Rosario', color: '#A78BFA' },
  { id: 4, region: 'Mendoza', color: '#FBBF24' },
];

const features = [
  { titulo: 'Índices Geoespaciales', desc: '"Restaurantes a 2km de mí" en milisegundos. Mongo entiende coordenadas nativamente.', icon: '🗺️', code: 'db.restaurantes.createIndex({ "coords": "2dsphere" })' },
  { titulo: 'Sharding Horizontal', desc: 'Si tu base crece, MongoDB la reparte entre múltiples servidores. Transparente al código.', icon: '⚡', code: 'sh.shardCollection("yapedis.pedidos", { region: 1 })' },
  { titulo: 'Replica Sets', desc: 'Alta disponibilidad: si un servidor cae, otro toma su lugar automáticamente.', icon: '🛡️', code: 'rs.initiate({ _id: "rs0", members: [...] })' },
  { titulo: 'Aggregation Pipeline', desc: 'Transformaciones complejas en una pipeline declarativa. Más simple que SQL anidado.', icon: '🔄', code: 'db.pedidos.aggregate([\n  { $match: ... },\n  { $group: ... },\n  { $sort: ... }\n])' },
];

function Bloque3() {
  const [queries, setQueries] = useState([]);
  const [running, setRunning] = useState(true);
  const [counts, setCounts] = useState({1:0,2:0,3:0,4:0});

  useEffect(() => {
    if (!running) return;
    const interval = setInterval(() => {
      const shardId = Math.floor(Math.random()*4)+1;
      const id = Date.now() + Math.random();
      setQueries(q => [...q.slice(-20), { id, shardId, x: 45 + Math.random()*10 }]);
      setCounts(c => ({...c, [shardId]: c[shardId] + 1}));
      setTimeout(() => setQueries(q => q.filter(x => x.id !== id)), 1300);
    }, 350);
    return () => clearInterval(interval);
  }, [running]);

  return html`
    <div class="min-h-full p-10 lg:p-16">
      <div class="max-w-7xl mx-auto">
        <div class="mb-2 text-mongo-green text-sm font-semibold tracking-wider uppercase">Bloque 3 · Performance y Escala</div>
        <h2 class="text-5xl font-extrabold mb-4">Hecho para <span class="gradient-text">escalar.</span></h2>
        <p class="text-xl text-white/70 mb-10 max-w-3xl">
          Si mañana YaPedís explota y tenés 10 millones de pedidos por día, MongoDB se reparte solo entre servidores. Sin reescribir nada.
        </p>

        <div class="grid grid-cols-2 gap-4 mb-10">
          ${features.map((f,i) => html`
            <div key=${f.titulo} class="p-5 bg-white/5 border border-white/10 rounded-xl hover:border-mongo-green/40 transition-all fade-up" style=${{animationDelay:`${i*0.08}s`}}>
              <div class="flex items-start gap-3 mb-2">
                <div class="text-3xl">${f.icon}</div>
                <div class="flex-1">
                  <div class="font-bold text-lg text-mongo-green">${f.titulo}</div>
                  <div class="text-sm text-white/60">${f.desc}</div>
                </div>
              </div>
              <pre class="text-[11px] font-mono bg-mongo-dark/60 p-2 rounded text-mongo-mint overflow-x-auto m-0">${f.code}</pre>
            </div>
          `)}
        </div>

        <div class="bg-white/5 border border-white/10 rounded-xl p-6">
          <div class="flex items-center justify-between mb-6">
            <div>
              <h3 class="font-bold text-lg mb-1">🔀 Sharding en acción</h3>
              <p class="text-sm text-white/50">Los pedidos se reparten entre 4 servidores según la región.</p>
            </div>
            <button onClick=${()=>setRunning(!running)} class="px-4 py-2 bg-mongo-green text-mongo-dark font-bold rounded-lg hover:bg-mongo-mint transition-all">
              ${running ? '⏸ Pausar' : '▶ Reanudar'}
            </button>
          </div>

          <div class="relative h-64">
            <div class="absolute left-1/2 top-0 -translate-x-1/2 z-10">

                return html`
                  <div key=${q.id} class="absolute query-drop" style=${{
                    left: `calc(${targetLeft}% - 4px)`,
                    top: '40px',
                    width: '8px',

                    borderRadius: '50%',
                    background: shards[idx].color,
                    boxShadow: `0 0 8px ${shards[idx].color}`

                `;
              })}
            </div>

            <div class="absolute bottom-0 left-0 right-0 flex justify-around gap-4">
              ${shards.map(s => html`
                <div key=${s.id} class="flex flex-col items-center gap-2">

                    <div class="text-xs uppercase tracking-wider text-white/60">Shard ${s.id}</div>
                    <div class="font-bold text-sm" style=${{color: s.color}}>${s.region}</div>
                  </div>
                  <div class="text-xs text-white/40 font-mono tabular-nums">~${Math.floor(counts[s.id]/5) + 12} q/s</div>
                </div>
              `)}
            </div>
          </div>

          <div class="mt-4 text-center text-xs text-white/50">
            ¿Querés más capacidad? <strong class="text-mongo-green">Sumá otro shard.</strong> Sin downtime. Sin reescribir queries.
          </div>
        </div>
      </div>
    </div>
  `;
}

// =================== APP ===================
const slides = [
  { id: 0, label: 'Inicio', component: Portada },
  { id: 1, label: '1 · Problema', component: Bloque1 },
  { id: 2, label: '2 · ¿Qué es Mongo?', component: Bloque2 },
  { id: 3, label: '3 · Escala', component: Bloque3 },
  { id: 4, label: '4 · Demo', component: Bloque4 },
  { id: 5, label: '5 · Cierre', component: Bloque5 },
];

function App() {
  const [current, setCurrent] = useState(0);

  const goTo = useCallback((idx) => {
    if (idx < 0 || idx >= slides.length) return;
    setCurrent(idx);
  }, []);

  useEffect(() => {
    const handler = (ev) => {
      if (ev.key === 'ArrowRight' || ev.key === ' ') goTo(current + 1);
      if (ev.key === 'ArrowLeft') goTo(current - 1);
      const num = parseInt(ev.key);
      if (!isNaN(num) && num >= 0 && num <= 5) goTo(num);
    };
    window.addEventListener('keydown', handler);
    return () => window.removeEventListener('keydown', handler);
  }, [current, goTo]);

  const Current = slides[current].component;

  return html`
    <div class="h-screen w-screen bg-mongo-dark text-white flex flex-col overflow-hidden">
      <div class="flex-1 relative overflow-hidden">
        <div key=${current} class="absolute inset-0 overflow-y-auto scrollbar-hide fade-in">
          <${Current} goTo=${goTo} />
        </div>
      </div>

      <div class="border-t border-white/10 bg-mongo-dark/95 backdrop-blur px-6 py-3 flex items-center justify-between gap-4">
        <div class="flex items-center gap-2">
          <div class="w-8 h-8 rounded-lg bg-mongo-green flex items-center justify-center">
            <svg viewBox="0 0 24 24" class="w-5 h-5" fill="#001E2B">
              <path d="M12 2C13 5 17 8 17 13c0 4-3 7-5 7s-5-3-5-7c0-5 4-8 5-11z"></path>
            </svg>
          </div>
          <span class="font-bold text-sm tracking-tight">YaPedís × MongoDB</span>
        </div>
        <div class="flex items-center gap-1.5">
          ${slides.map((s,i) => html`
            <button key=${s.id} onClick=${()=>goTo(i)} class=${`px-3 py-1.5 rounded-md text-xs font-medium transition-all ${i===current ? 'bg-mongo-green text-mongo-dark' : 'text-white/50 hover:text-white hover:bg-white/5'}`}>
              ${s.label}
            </button>
          `)}
        </div>
        <div class="flex items-center gap-2 text-xs text-white/40">
          <kbd class="px-1.5 py-0.5 bg-white/10 rounded">←</kbd>
          <kbd class="px-1.5 py-0.5 bg-white/10 rounded">→</kbd>
          <span>para navegar</span>
        </div>
      </div>
    </div>
  `;
}

createRoot(document.getElementById('root')).render(html`<${App} />`);
