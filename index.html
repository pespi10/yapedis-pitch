const perfilInicial = {

        </div>

function renderProfile(doc) {
  const renderValue = (v) => {
    if (v === null) return html`<span class="text-white/40 italic">null</span>`;
    if (typeof v === 'boolean') return v ? '✓ true' : '✗ false';
    if (typeof v === 'number') return html`<span class="text-mongo-green">${v}</span>`;
    if (Array.isArray(v)) return html`<div class="flex flex-wrap gap-1">${v.map((x,i) => html`<span key=${i} class="px-1.5 py-0.5 bg-white/10 rounded text-[10px]">${typeof x === 'object' ? JSON.stringify(x) : String(x)}</span>`)}</div>`;
    if (typeof v === 'object') return html`<div class="ml-2 pl-2 border-l-2 border-mongo-green/30 space-y-1 mt-1">${Object.entries(v).map(([k,vv]) => html`<div key=${k}><span class="text-white/40 text-[9px] uppercase">${k}:</span> <span class="text-xs">${renderValue(vv)}</span></div>`)}</div>`;
    return String(v);
  };
  return html`
    <div class="space-y-1.5 text-xs">
      ${Object.entries(doc).map(([k,v]) => html`
        <div key=${k}>
          <div class="text-[10px] text-mongo-green uppercase tracking-wider font-semibold">${k}</div>
          <div class="ml-1">${renderValue(v)}</div>
        </div>
      `)}
    </div>
  `;
}

// =================== APP ===================
const slides = [
  { id: 0, labelDesktop: 'Inicio', labelMobile: '⌂', component: Portada },
  { id: 1, labelDesktop: '1 · Documental', labelMobile: '1', component: Bloque1 },
  { id: 2, labelDesktop: '2 · Modelo', labelMobile: '2', component: Bloque2 },
  { id: 3, labelDesktop: '3 · Propuesta', labelMobile: '3', component: Bloque3 },
  { id: 4, labelDesktop: '4 · Escala', labelMobile: '4', component: Bloque4 },
  { id: 5, labelDesktop: '5 · Cierre', labelMobile: '5', component: Bloque5 },
];

function App() {
  const [current, setCurrent] = useState(0);
  const [swipeHint, setSwipeHint] = useState('right');
  const hintTimerRef = useRef(null);

  const goTo = useCallback((idx) => {
    if (idx < 0 || idx >= slides.length) return;
    setCurrent(idx);
    if (hintTimerRef.current) clearTimeout(hintTimerRef.current);

    if (idx === 0) {
      setSwipeHint('right');
    } else {
      setSwipeHint(null);
    }
  }, []);

  useEffect(() => {
    const handler = (ev) => {
      if (ev.key === 'ArrowRight' || ev.key === ' ') goTo(current + 1);
      if (ev.key === 'ArrowLeft') goTo(current - 1);
      const num = parseInt(ev.key);
      if (!isNaN(num) && num >= 0 && num <= 5) goTo(num);
    };
    window.addEventListener('keydown', handler);
    return () => window.removeEventListener('keydown', handler);
  }, [current, goTo]);

  // Swipe en mobile
  useEffect(() => {
    let startX = 0, startY = 0;
    const onStart = (e) => {
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
    };
    const onEnd = (e) => {
      const dx = e.changedTouches[0].clientX - startX;
      const dy = e.changedTouches[0].clientY - startY;
      if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) {
        if (dx < 0) goTo(current + 1);
        else goTo(current - 1);
      }
    };
    window.addEventListener('touchstart', onStart, { passive: true });
    window.addEventListener('touchend', onEnd, { passive: true });
    return () => {
      window.removeEventListener('touchstart', onStart);
      window.removeEventListener('touchend', onEnd);
    };
  }, [current, goTo]);

  useEffect(() => {
    if (current === 0) setSwipeHint('right');
  }, []);

  const handleSlideScroll = useCallback(() => {}, []);

  const Current = slides[current].component;
  const isFirst = current === 0;
  const isLast = current === slides.length - 1;

  return html`
    <div class="h-screen w-screen bg-mongo-dark text-white flex flex-col overflow-hidden">
      <div class="flex-1 relative overflow-hidden">
        <div key=${current} onScroll=${handleSlideScroll} class="absolute inset-0 overflow-y-auto overflow-x-hidden scrollbar-hide fade-in">
          <${Current} goTo=${goTo} />
        </div>

        <!-- Hint mobile de swipe: orienta, no reemplaza el gesto -->
        ${swipeHint && html`
          <div class=${`md:hidden fixed ${swipeHint === 'right' ? 'right-5' : 'left-5'} bottom-20 z-30 pointer-events-none transition-opacity duration-500`}>
            <div class=${`text-mongo-green font-black text-6xl leading-none drop-shadow-[0_0_12px_rgba(0,237,100,0.65)] ${swipeHint === 'right' ? 'swipe-right-hint' : 'swipe-left-hint'}`}>
              ${swipeHint === 'right' ? '⟵' : '⟶'}
            </div>
          </div>
        `}
      </div>

      <div class="border-t border-white/10 bg-mongo-dark/95 backdrop-blur px-3 sm:px-6 py-1.5 flex items-center justify-between gap-2 sm:gap-4 flex-shrink-0">
        <div class="flex items-center gap-2 flex-shrink-0">
          <div class="w-7 h-7 rounded-lg bg-mongo-green flex items-center justify-center">
            <svg viewBox="0 0 24 24" class="w-4 h-4 sm:w-5 sm:h-5" fill="#001E2B">
              <path d="M12 2C13 5 17 8 17 13c0 4-3 7-5 7s-5-3-5-7c0-5 4-8 5-11z"></path>
            </svg>
          </div>
          <span class="hidden md:inline font-bold text-sm tracking-tight">MongoDB × ActionWave</span>
        </div>
        <div class="flex items-center gap-1 sm:gap-1.5 overflow-x-auto scrollbar-hide">
          ${slides.map((s,i) => html`
            <button key=${s.id} onClick=${()=>goTo(i)} class=${`px-2 sm:px-3 py-1 rounded-md text-[11px] sm:text-xs font-medium transition-all flex-shrink-0 ${i===current ? 'bg-mongo-green text-mongo-dark' : 'text-white/50 hover:text-white hover:bg-white/5'}`}>
              <span class="sm:hidden">${s.labelMobile}</span>
              <span class="hidden sm:inline">${s.labelDesktop}</span>
            </button>
          `)}
        </div>
        <div class="hidden lg:flex items-center gap-1.5 text-[10px] text-white/40 flex-shrink-0">
          <kbd class="px-1 py-0.5 bg-white/10 rounded">←</kbd>
          <kbd class="px-1 py-0.5 bg-white/10 rounded">→</kbd>
        </div>
      </div>
    </div>
  `;
}
